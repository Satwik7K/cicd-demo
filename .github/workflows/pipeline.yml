name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cicd-demo:${{ github.sha }} .

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d cicd-demo ]; then
              git clone https://github.com/Satwik7K/cicd-demo.git
            fi
            cd cicd-demo
            git pull
            docker build -t cicd-demo .
            docker rm -f cicd-demo || true
            docker run -d --name cicd-demo --restart unless-stopped -p 80:5000 cicd-demo
            sleep 5
            curl -f http://localhost/health